name: Construir APK

on:
  workflow_dispatch:
    inputs:
      presupuesto:
        description: 'Tope máximo en euros (tu amigo no lo verá)'
        required: true
      nombre:
        description: 'Nombre de tu amigo'
        required: true
        default: 'Lastras'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generar la app con el tope escondido
        env:
          PRESUPUESTO: ${{ inputs.presupuesto }}
          NOMBRE: ${{ inputs.nombre }}
        run: node build.js --budget "$PRESUPUESTO" --name "$NOMBRE"

      - name: Instalar Capacitor
        run: npm install

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: casa-nueva-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
