<title>Casa nueva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Concepto: cada habitación es una muestra de pintura (color arriba, nombre en la tira blanca).
   Papel gris azulado, tinta oscura, amarillo de llave como único acento. */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --ink: #15202B;
  --muted: #566573;
  --line: #D3DAE1;
  --accent: #F5C02B;
  --on-accent: #15202B;
  --photo-bg: #F6F7F9;
  --scrim: rgba(12, 20, 28, 0.55);
  --c-cocina: #F29A2E;
  --c-salon: #3F6FD9;
  --c-bano: #2FB39C;
  --c-dormitorio: #E5617C;
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171F;
    --surface: #17222D;
    --ink: #E8EEF3;
    --muted: #9AA8B5;
    --line: #2B3846;
    --scrim: rgba(0, 0, 0, 0.65);
    --c-cocina: #F5A845;
    --c-salon: #6C93EE;
    --c-bano: #4CC9B2;
    --c-dormitorio: #F0788F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171F;
  --surface: #17222D;
  --ink: #E8EEF3;
  --muted: #9AA8B5;
  --line: #2B3846;
  --scrim: rgba(0, 0, 0, 0.65);
  --c-cocina: #F5A845;
  --c-salon: #6C93EE;
  --c-bano: #4CC9B2;
  --c-dormitorio: #F0788F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.app {
  max-width: 760px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}

.kicker {
  margin: 0;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.hello { display: flex; flex-direction: column; gap: 12px; }
.hello h1 { font-size: clamp(2rem, 8.4vw, 3.2rem); line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; }
.hello h1 .who { background: linear-gradient(transparent 62%, var(--accent) 62%); padding-inline: 2px; }
.lead { margin: 0; max-width: 34em; color: var(--muted); font-size: 1.02rem; }

/* muestras de pintura */
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chip {
  display: flex; flex-direction: column;
  padding: 0; text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 1px 0 var(--line), 0 10px 18px -14px rgba(12, 20, 28, 0.5);
  transition: transform 0.15s ease;
  min-width: 0;
}
.chip:hover { transform: translateY(-3px); }
.chip .swatch { display: block; aspect-ratio: 4 / 3; max-width: 100%; background: var(--sw); overflow: hidden; }
.chip .art, .chip .art-photo { display: block; width: 100%; height: 100%; object-fit: cover; }
.chip .strip { display: flex; flex-direction: column; gap: 2px; padding: 12px 12px 14px; }
.chip .name { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.chip .sub { font-size: 0.86rem; color: var(--muted); }

/* cabecera de habitación */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 0.92rem;
}
.room-title { display: flex; align-items: center; gap: 10px; }
.room-title .dot { width: 14px; height: 14px; border-radius: 3px; background: var(--sw); flex: none; }
.room-title h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 0.9rem;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  display: flex; flex-direction: column; padding: 0; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden; min-width: 0;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.card:hover { border-color: var(--ink); transform: translateY(-2px); }
.photo {
  aspect-ratio: 1 / 1; max-width: 100%;
  background: var(--photo-bg);
  display: grid; place-items: center; overflow: hidden;
}
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ph {
  display: grid; place-items: center; width: 100%; height: 100%;
  padding: 12px; text-align: center;
  font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  color: #15202B; background: var(--ph, var(--photo-bg));
  overflow-wrap: anywhere;
}
.card .meta { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; min-width: 0; }
.card .model { font-family: var(--font-display); font-weight: 800; font-size: 0.98rem; overflow-wrap: anywhere; }
.card .desc {
  font-size: 0.86rem; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.store {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}
.empty { color: var(--muted); padding: 24px 0; }

/* hoja de confirmación */
.scrim {
  position: fixed; inset: 0; background: var(--scrim);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 20;
}
.sheet {
  background: var(--surface); width: 100%; max-width: 560px;
  border-radius: 14px 14px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  max-height: 92%; overflow-y: auto;
}
.sheet .photo { border-radius: 8px; aspect-ratio: 4 / 3; }
.sheet h3 { font-size: 1.5rem; font-weight: 800; }
.sheet .desc { margin: 0; color: var(--muted); }
.warn { margin: 0; font-size: 0.9rem; color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.btn {
  border: 2px solid var(--ink); background: transparent; color: var(--ink);
  border-radius: 10px; padding: 13px 18px; font-weight: 700; font-size: 1rem;
  text-align: center; text-decoration: none; display: block;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.quiet { border-color: var(--line); font-weight: 600; }

/* resultado */
.result { align-items: stretch; text-align: center; gap: 18px; }
.result .photo { border-radius: 10px; aspect-ratio: 1 / 1; max-width: 460px; width: 100%; margin-inline: auto; border: 1px solid var(--line); }
.result h1 { font-size: clamp(2.2rem, 10vw, 3.6rem); font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.result .desc { margin: 0; font-size: 1.1rem; color: var(--muted); }
.result .tag { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 0.85rem; font-weight: 700;
}
.result .actions { max-width: 460px; width: 100%; margin-inline: auto; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i {
  position: absolute; top: -20px; width: 9px; height: 16px; border-radius: 2px;
  background: var(--cc); opacity: 0;
  animation: fall var(--d) ease-in var(--delay) forwards;
}
@keyframes fall {
  0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 1; }
  100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
  .chip, .card { transition: none; }
}

/* preparación (solo para quien regala) */
.setup h1 { font-size: clamp(1.9rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 18px 16px; display: flex; flex-direction: column; gap: 16px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 0.92rem; }
.field input {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; width: 100%;
  font-variant-numeric: tabular-nums;
}
.hint { margin: 0; font-size: 0.88rem; color: var(--muted); }
.cover { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.cover li { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.cover .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--sw); flex: none; }
.code {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size: 0.78rem; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all;
}
.preview-bar {
  position: sticky; top: 0; z-index: 10;
  background: var(--ink); color: var(--bg);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 8px 16px; font-size: 0.85rem; font-variant-numeric: tabular-nums;
}
.preview-bar button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 700; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 40;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-weight: 600; font-size: 0.92rem;
}
</style>

    } else fallback();
  }

  /* ───────── vistas ───────── */
  function previewBar() {
    if (!isAdmin || state.view === 'setup') return '';
    return '<div class="preview-bar"><span>Vista previa · tope ' + esc(money(adminCfg.b)) +
      '</span><button type="button" data-act="setup">Volver a preparar</button></div>';
  }

  function viewSetup() {
    var token = encode({ b: adminCfg.b, n: adminCfg.n, r: adminCfg.r });
    var rows = ROOMS.map(function (r) {
      return '<li><span class="dot" style="--sw:' + r.color + '"></span>' + esc(r.name) +
        ': <strong data-count="' + r.id + '">' + inRoom(r.id, adminCfg.b).length + '</strong> / ' +
        CATALOG.filter(function (p) { return p.room === r.id; }).length + '</li>';
    }).join('');
    return '<main class="app setup">' +
      '<header class="hello"><p class="kicker">Solo para ti</p><h1>Prepara el regalo</h1>' +
      '<p class="lead">Elige el tope de precio. Lastras solo verá productos de ese precio o menos y nunca verá la cifra.</p></header>' +
      '<form class="panel" id="setup-form" autocomplete="off">' +
      '<div class="field"><label for="f-name">Nombre de tu amigo</label><input id="f-name" type="text" maxlength="30" value="' + esc(adminCfg.n) + '"></div>' +
      '<div class="field"><label for="f-budget">Presupuesto máximo (€)</label><input id="f-budget" type="number" inputmode="decimal" min="1" step="1" value="' + esc(adminCfg.b) + '">' +
      '<p class="hint">Productos que caben en cada habitación con este tope:</p><ul class="cover" id="cover">' + rows + '</ul></div>' +
      '<button class="btn primary" type="submit">Probar como ' + esc(adminCfg.n) + '</button>' +
      '</form>' +
      '<section class="panel"><h2 style="font-size:1.2rem">Dejarlo fijo antes de enviarlo</h2>' +
      '<p class="hint">Esta pantalla de preparación solo aparece cuando la app no lleva un código. Para la versión que recibirá ' + esc(adminCfg.n) + ', genera la app con este código y no podrá cambiar el tope ni verlo.</p>' +
      '<div class="code" id="token-box">' + esc(token) + '</div>' +
      '<button class="btn quiet" type="button" data-act="copy-token">Copiar código</button></section>' +
      '</main>';
  }

  function viewHome() {
    var chips = ROOMS.map(function (r) {
      return '<button class="chip" type="button" data-act="room" data-room="' + r.id + '">' +
        '<span class="swatch" style="--sw:' + r.color + '">' + roomArt(r.id) + '</span>' +
        '<span class="strip"><span class="name">' + esc(r.name) + '</span><span class="sub">' + esc(r.sub) + '</span></span></button>';
    }).join('');
    return previewBar() + '<main class="app">' +
      '<header class="hello"><p class="kicker">Casa nueva</p>' +
      '<h1>Buenas, <span class="who">' + esc(who()) + '</span>. ¿Qué necesitas para tu casa?</h1>' +
      '<p class="lead">Tus amigos te regalan una cosa para la casa. Entra en una habitación y elige lo que más falta te haga. Solo puedes elegir una.</p></header>' +
      '<div class="chips">' + chips + '</div></main>';
  }

  function viewRoom() {
    var room = roomById(state.room);
    var all = shuffled(inRoom(room.id, budget()), hash(room.id));
    var stores = [];
    all.forEach(function (p) { if (stores.indexOf(p.store) < 0) stores.push(p.store); });
    if (state.store !== 'todas' && stores.indexOf(state.store) < 0) state.store = 'todas';
    var items = state.store === 'todas' ? all : all.filter(function (p) { return p.store === state.store; });

    var filters = '';
    if (stores.length > 1) {
      filters = '<div class="filters" role="group" aria-label="Filtrar por tienda">' +
        ['todas'].concat(stores).map(function (s) {
          return '<button type="button" data-act="store" data-store="' + esc(s) + '" aria-pressed="' + (state.store === s) + '">' +
            (s === 'todas' ? 'Todas las tiendas' : esc(s)) + '</button>';
        }).join('') + '</div>';
    }
    var cards = items.map(function (p) {
      return '<button class="card" type="button" data-act="open" data-id="' + p.id + '">' +
        '<span class="photo">' + imgTag(p, 'm') + '</span>' +
        '<span class="meta"><span class="model">' + esc(p.model) + '</span><span class="desc">' + esc(p.desc) +
        '</span><span class="store">' + esc(p.store) + '</span></span></button>';
    }).join('');
    return previewBar() + '<main class="app">' +
      '<div class="bar"><button class="back" type="button" data-act="home">← Habitaciones</button>' +
      '<div class="room-title"><span class="dot" style="--sw:' + room.color + '"></span><h2>' + esc(room.name) + '</h2></div></div>' +
      filters +
      (items.length ? '<div class="grid">' + cards + '</div>' : '<p class="empty">Aquí no hay nada que enseñarte. Prueba otra habitación.</p>') +
      '</main>' + sheet();
  }

  function sheet() {
    if (state.sel === null) return '';
    var p = CATALOG[state.sel];
    return '<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(p.model) + '">' +
      '<span class="photo">' + imgTag(p, 'l') + '</span>' +
      '<div><p class="store">' + esc(p.store) + '</p><h3>' + esc(p.model) + '</h3><p class="desc">' + esc(p.desc) + '</p></div>' +
      '<p class="warn">' + (isAdmin ? 'Vista previa: aquí se puede repetir.' : 'Solo puedes elegir uno y después no se puede cambiar.') + '</p>' +
      '<div class="actions"><button class="btn primary" type="button" data-act="pick" data-id="' + p.id + '">Elegir este</button>' +
      '<button class="btn quiet" type="button" data-act="close-sheet-btn">Seguir mirando</button></div></div></div>';
  }

  function shareText(p) {
    return who() + ' ha elegido para su casa nueva: ' + p.model + ' (' + p.desc + '), ' + p.store + '. ' + p.url;
  }

  function viewResult() {
    var p = CATALOG[state.choice];
    return previewBar() + '<main class="app result">' +
      '<p class="kicker">Has elegido</p>' +
      '<span class="photo">' + imgTag(p, 'l') + '</span>' +
      '<h1>' + esc(p.model) + '</h1>' +
      '<p class="desc">' + esc(p.desc) + '</p>' +
      '<div class="tag"><span class="pill">' + esc(p.store) + '</span><span class="pill">' + esc(money(p.price)) + '</span></div>' +
      '<div class="actions">' +
      '<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(shareText(p)) + '">Avisar a los amigos por WhatsApp</a>' +
      '<button class="btn" type="button" data-act="copy-msg">Copiar el mensaje</button>' +
      '<a class="btn quiet" target="_blank" rel="noopener" href="' + esc(p.url) + '">Ver en la tienda</a>' +
      (isAdmin ? '<button class="btn quiet" type="button" data-act="again">Probar otra vez</button>' : '') +
      '</div></main>';
  }

  function render() {
    var html = state.view === 'setup' ? viewSetup()
      : state.view === 'home' ? viewHome()
      : state.view === 'room' ? viewRoom()
      : viewResult();
    root.innerHTML = html;
    if (state.view !== 'room' || state.sel === null) window.scrollTo(0, 0);
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = document.createElement('div');
    box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 70; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random() * 100) + '%';
      s.style.setProperty('--cc', CONFETTI[i % CONFETTI.length]);
      s.style.setProperty('--d', (1.8 + Math.random() * 1.6) + 's');
      s.style.setProperty('--delay', (Math.random() * 0.6) + 's');
      s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 4200);
  }

  /* ───────── eventos ───────── */
  function readForm() {
    var n = document.getElementById('f-name').value.trim() || 'Lastras';
    var b = parseFloat(String(document.getElementById('f-budget').value).replace(',', '.'));
    if (!(b > 0)) b = adminCfg.b;
    return { n: n, b: Math.round(b * 100) / 100, r: adminCfg.r };
  }
  function saveAdmin() { store('lastras-admin', JSON.stringify(adminCfg)); }

  root.addEventListener('input', function (e) {
    if (state.view !== 'setup') return;
    if (e.target.id !== 'f-budget' && e.target.id !== 'f-name') return;
    var f = readForm();
    ROOMS.forEach(function (r) {
      var el = root.querySelector('[data-count="' + r.id + '"]');
      if (el) el.textContent = inRoom(r.id, f.b).length;
    });
    var box = document.getElementById('token-box');
    if (box) box.textContent = encode(f);
  });

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    if (state.view !== 'setup') return;
    adminCfg = readForm(); saveAdmin();
    state.view = 'home'; state.choice = null; state.sel = null;
    render();
  });

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'close-sheet' && e.target !== el) return; /* clic dentro de la hoja */
    if (act === 'room') { state.room = el.getAttribute('data-room'); state.store = 'todas'; state.view = 'room'; render(); }
    else if (act === 'home') { state.view = 'home'; state.sel = null; render(); }
    else if (act === 'store') { state.store = el.getAttribute('data-store'); render(); }
    else if (act === 'open') { state.sel = parseInt(el.getAttribute('data-id'), 10); render(); }
    else if (act === 'close-sheet' || act === 'close-sheet-btn') { state.sel = null; render(); }
    else if (act === 'pick') {
      state.choice = parseInt(el.getAttribute('data-id'), 10);
      state.sel = null; state.view = 'result';
      if (gift) store(choiceKey, JSON.stringify({ id: state.choice }));
      render(); confetti();
    }
    else if (act === 'copy-msg') { copyText(shareText(CATALOG[state.choice])); }
    else if (act === 'again') { state.choice = null; state.view = 'home'; render(); }
    else if (act === 'setup') { state.view = 'setup'; state.sel = null; render(); }
    else if (act === 'copy-token') { copyText(encode(readForm())); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.sel !== null) { state.sel = null; render(); }
  });

  /* imágenes: probar tamaños alternativos y, si falla, mostrar un recuadro con el nombre */
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    var p = CATALOG[parseInt(img.getAttribute('data-id'), 10)];
    if (!p) return;
    var n = parseInt(img.getAttribute('data-n'), 10) + 1;
    var list = imgSources(p, img.getAttribute('data-size'));
    if (n < list.length) { img.setAttribute('data-n', n); img.src = list[n]; return; }
    var ph = document.createElement('span');
    ph.className = 'ph';
    var room = roomById(p.room);
    ph.style.setProperty('--ph', room ? room.color : 'var(--photo-bg)');
    ph.textContent = p.model;
    img.replaceWith(ph);
  }, true);

  render();
})();

</script>
